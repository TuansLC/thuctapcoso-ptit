<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<body>

<!--/*
  Hiển thị flash message. GlobalExceptionHandler đặt "errorMessage",
  các controller đặt "successMessage" (DOAN.md mục 12).

  role="alert" để trình đọc màn hình đọc ngay khi thông báo xuất hiện.
*/-->
<div th:fragment="messages">
    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}">Thành công</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"
                aria-label="Đóng thông báo"></button>
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}">Có lỗi</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"
                aria-label="Đóng thông báo"></button>
    </div>
</div>

</body>
</html>
